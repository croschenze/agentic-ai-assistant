<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助手对话</title>
    <link rel="stylesheet" href="participant-styles.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="firebase-config.js"></script>
    <script src="firebase-comm.js"></script>
</head>
<body>
    <!-- 会话加入界面 -->
    <div id="session-join-container" class="session-join-container">
        <div class="join-form">
            <h2>Start Your Session Here</h2>
            <input type="text" id="session-join-input" placeholder="输入会话ID (例如: WOZ-EPQ6I2C1)">
            <button id="session-join-btn">加入会话</button>
        </div>
    </div>
    
    <!-- 聊天界面 -->
    <div id="chat-container" class="chat-container" style="display: none;">
        <div class="main-content">
            <div class="chat-header">
                <div class="header-left">
                    <div class="session-info">
                        <div class="session-id" id="session-id-label">Session ID: <span id="session-id">Loading...</span></div>
                    </div>
                </div>
                <h1 id="chat-title">AI Assistant</h1>
                <div class="header-controls">
                    <div class="session-status" id="session-status">Connecting...</div>
                    <button class="language-toggle" id="language-toggle">中文</button>
                </div>
            </div>
            
            <!-- 上传文件显示区域已移除，被测者不需要查看文件列表 -->
            
            <div class="chat-messages" id="chat-messages">
            </div>
            
            <div class="waiting-indicator" id="waiting-indicator" style="display: none;">
                <div class="spinner"></div>
                <span>AI正在思考中...</span>
            </div>
            
            <div class="file-drop-zone" id="file-drop-zone">
                <div class="drop-message">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14,2 14,8 20,8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10,9 9,9 8,9"></polyline>
                    </svg>
                    <p>拖拽PDF文件到此处上传</p>
                </div>
            </div>
            
            <div class="chat-input-container">
                <div class="chat-input">
                    <input type="file" id="file-input" accept=".pdf,.jpg,.jpeg,.png" style="display: none;">
                    <button class="file-button" id="file-button" title="上传文件 (PDF, JPEG, PNG)">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66L9.64 16.2a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                    </button>
                    <input type="text" id="message-input" placeholder="输入您的消息..." maxlength="1000">
                    <button id="send-button" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22,2 15,22 11,13 2,9 22,2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 控制面板侧边栏 -->
        <div id="control-panel" class="control-panel">
            <div class="control-panel-header">
                <h2 class="control-panel-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v6m0 6v6m11-7h-6m-6 0H1"></path>
                    </svg>
                    控制面板
                </h2>
                
                <!-- 模式切换 -->
                <div class="mode-toggle">
                    <h3 id="settings-mode-title">文本对话设置</h3>
                    <button id="mode-toggle-btn" class="mode-toggle-btn" title="切换设置模式">
                        <svg id="mode-toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="9" cy="9" r="2"></circle>
                            <path d="M21 15l-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- 设置模块容器 -->
            <div class="settings-modules">
                <!-- AI 性格设置模块 -->
                <div id="ai-personality-settings" class="settings-module active">
                    <div class="setting-group">
                        <div class="setting-label-container">
                            <label class="setting-label">Creativity</label>
                            <div class="help-icon" data-tooltip="creativity">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <circle cx="12" cy="17" r="0.5" fill="#999"></circle>
                        </svg>
                            </div>
                        </div>
                        <div class="slider-container">
                            <div class="slider-labels">
                                <span>严谨</span>
                                <span>创意</span>
                            </div>
                            <div class="slider-wrapper">
                                <input type="range" id="creativity-slider" class="slider" min="0" max="10" value="5" step="1">
                                <div class="slider-ticks">
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                </div>
                            </div>
                            <div class="slider-value" id="creativity-value">0</div>
                        </div>
                    </div>
                    
                    <div class="setting-group">
                        <div class="setting-label-container">
                            <label class="setting-label">Personality</label>
                            <div class="help-icon" data-tooltip="personality">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                                    <circle cx="12" cy="17" r="0.5" fill="#999"></circle>
                                </svg>
                            </div>
                        </div>
                        <div class="slider-container">
                            <div class="slider-labels">
                                <span>沉着</span>
                                <span>活泼</span>
                            </div>
                            <div class="slider-wrapper">
                                <input type="range" id="personality-slider" class="slider" min="0" max="10" value="5" step="1">
                                <div class="slider-ticks">
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                </div>
                            </div>
                            <div class="slider-value" id="personality-value">0</div>
                        </div>
                    </div>
                    
                    <div class="setting-group">
                        <div class="setting-label-container">
                            <label class="setting-label">Working Style</label>
                            <div class="help-icon" data-tooltip="workingStyle">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                                    <circle cx="12" cy="17" r="0.5" fill="#999"></circle>
                                </svg>
                            </div>
                        </div>
                        <div class="slider-container">
                            <div class="slider-labels">
                                <span>执行者</span>
                                <span>主导者</span>
                            </div>
                            <div class="slider-wrapper">
                                <input type="range" id="workstyle-slider" class="slider" min="0" max="10" value="5" step="1">
                                <div class="slider-ticks">
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                </div>
                            </div>
                            <div class="slider-value" id="workstyle-value">0</div>
                        </div>
                    </div>
                </div>
                
                <!-- 图片编辑设置模块 -->
                <div id="image-settings" class="settings-module">
                    <!-- IMAGE SIZE 组 -->
                    <div class="setting-group">
                        <label class="setting-label">IMAGE SIZE</label>
                        
                        <!-- Width 滑块 -->
                        <div class="slider-container">
                            <div class="slider-header">
                                <span class="slider-title">Width</span>
                                <input type="number" id="width-input" class="slider-input" min="1" max="4000" value="1920">
                            </div>
                            <div class="slider-wrapper">
                                <input type="range" id="width-slider" class="slider" min="1" max="4000" value="1920" step="1">
                                <div class="slider-ticks">
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Height 滑块 -->
                        <div class="slider-container">
                            <div class="slider-header">
                                <span class="slider-title">Height</span>
                                <input type="number" id="height-input" class="slider-input" min="1" max="4000" value="1080">
                            </div>
                            <div class="slider-wrapper">
                                <input type="range" id="height-slider" class="slider" min="1" max="4000" value="1080" step="1">
                                <div class="slider-ticks">
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Sampling Steps 滑块 -->
                        <div class="slider-container">
                            <div class="slider-header">
                                <span class="slider-title">Sampling Steps</span>
                                <input type="number" id="sampling-steps-input" class="slider-input" min="1" max="100" value="19">
                            </div>
                            <div class="slider-wrapper">
                                <input type="range" id="sampling-steps-slider" class="slider" min="1" max="100" value="19" step="1">
                                <div class="slider-ticks">
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- BATCH 组 -->
                    <div class="setting-group">
                        <label class="setting-label">BATCH</label>
                        
                        <!-- Batch Count 滑块 -->
                        <div class="slider-container">
                            <div class="slider-header">
                                <span class="slider-title">Batch Count</span>
                                <input type="number" id="batch-count-input" class="slider-input" min="1" max="100" value="5">
                            </div>
                            <div class="slider-wrapper">
                                <input type="range" id="batch-count-slider" class="slider" min="1" max="100" value="5" step="1">
                                <div class="slider-ticks">
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Batch Size 滑块 -->
                        <div class="slider-container">
                            <div class="slider-header">
                                <span class="slider-title">Batch Size</span>
                                <input type="number" id="batch-size-input" class="slider-input" min="1" max="100" value="1">
                            </div>
                            <div class="slider-wrapper">
                                <input type="range" id="batch-size-slider" class="slider" min="1" max="100" value="1" step="1">
                                <div class="slider-ticks">
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                    <span class="tick"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="indexeddb-storage.js"></script>
    <script src="hybrid-storage.js"></script>
    <script src="storage-monitor.js"></script>
    <script src="large-file-handler.js"></script>
    <script src="communication.js"></script>
    <script src="participant-script.js"></script>
</body>
</html>
